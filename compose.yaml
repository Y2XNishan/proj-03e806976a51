services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:8080
      DAY_AHEAD_CUTOFF_LOCAL: ${DAY_AHEAD_CUTOFF_LOCAL:-12:00}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/summary', timeout=10).read()"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

